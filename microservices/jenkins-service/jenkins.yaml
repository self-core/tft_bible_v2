jenkins:
  systemMessage: "TFT Bible - Jenkins CI/CD Pipeline (Microservices)"

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: admin123
          name: "Jenkins Admin"

  authorizationStrategy:
    globalMatrix:
      permissions:
        - "Overall/Administer:admin"
        - "Overall/Read:authenticated"

  remotingSecurity:
    enabled: true

  agentProtocols:
    - "JNLP4-connect"
    - "Ping"

  clouds:
    - docker:
        name: "docker-cloud"
        dockerApi:
          dockerHost:
            uri: "unix:///var/run/docker.sock"
        templates:
          - labelString: "docker-agent"
            dockerTemplateBase:
              image: "jenkins/agent:latest"
              privileged: true
              volumes:
                - "/var/run/docker.sock:/var/run/docker.sock"
            remoteFs: "/home/jenkins/agent"
            connector:
              attach:
                user: "jenkins"

  jobs:
    - script: >
        pipelineJob('tft-bible-microservices-pipeline') {
          definition {
            cpsScm {
              scm {
                git {
                  remote {
                    url('https://github.com/your-org/tft-bible-v2.git')
                  }
                  branch('*/main')
                }
              }
              scriptPath('Jenkinsfile')
            }
          }
        }