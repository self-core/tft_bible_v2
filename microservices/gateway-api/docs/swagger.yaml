openapi: 3.0.0
info:
  title: TFT Bible Gateway API
  description: Gateway API for TFT Bible project with service discovery and GraphQL capabilities
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.tftbible.com
    description: Production server
paths:
  /health:
    get:
      summary: Health check for the gateway
      responses:
        '200':
          description: Gateway health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  service:
                    type: string
                    example: "gateway-api"
                  timestamp:
                    type: string
                    example: "2025-12-12T06:00:00Z"
                  version:
                    type: string
                    example: "1.0.0"
                  checks:
                    type: object
                    properties:
                      etcd_connection:
                        type: string
                        example: "healthy"

  /detailed-health:
    get:
      summary: Detailed health check for the gateway and services
      responses:
        '200':
          description: Detailed health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  service:
                    type: string
                    example: "gateway-api"
                  timestamp:
                    type: string
                    example: "2025-12-12T06:00:00Z"
                  version:
                    type: string
                    example: "1.0.0"
                  etcd_status:
                    type: string
                    example: "healthy"
                  registered_services:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                          example: "healthy"
                        total_count:
                          type: integer
                          example: 1
                        healthy_count:
                          type: integer
                          example: 1

  /metrics:
    get:
      summary: Gateway metrics
      responses:
        '200':
          description: Gateway metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                    example: "2025-12-12T06:00:00Z"
                  metrics:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        total_requests:
                          type: integer
                        failed_requests:
                          type: integer
                        avg_duration:
                          type: string
                  gateway_stats:
                    type: object
                    properties:
                      total_circuit_breakers:
                        type: integer

  /register:
    post:
      summary: Register a service with the discovery system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  example: "service-123"
                name:
                  type: string
                  example: "champion-service"
                host:
                  type: string
                  example: "champion-service"
                port:
                  type: string
                  example: "8000"
                health:
                  type: string
                  example: "Healthy"
                metadata:
                  type: object
      responses:
        '200':
          description: Service registered successfully
        '400':
          description: Invalid request
        '500':
          description: Internal server error

  /discover/{service_name}:
    get:
      summary: Discover services by name
      parameters:
        - name: service_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of service instances
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        host:
                          type: string
                        port:
                          type: string
                        health:
                          type: string
                        updated:
                          type: string
        '500':
          description: Internal server error

  /graphql:
    post:
      summary: Execute a GraphQL query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  example: "{ champions { id name cost traits } }"
                variables:
                  type: object
      responses:
        '200':
          description: GraphQL response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  errors:
                    type: array
                    items:
                      type: object
    get:
      summary: GraphQL Playground
      responses:
        '200':
          description: GraphQL Playground UI

  /api/{path}:
    get:
      summary: Proxy GET requests to microservices
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          example: "/champions"
      responses:
        '200':
          description: Response from backend service
          content:
            application/json:
              schema:
                type: object
    post:
      summary: Proxy POST requests to microservices
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          example: "/champions"
      responses:
        '200':
          description: Response from backend service
          content:
            application/json:
              schema:
                type: object
    put:
      summary: Proxy PUT requests to microservices
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          example: "/champions/123"
      responses:
        '200':
          description: Response from backend service
          content:
            application/json:
              schema:
                type: object
    delete:
      summary: Proxy DELETE requests to microservices
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          example: "/champions/123"
      responses:
        '200':
          description: Response from backend service
          content:
            application/json:
              schema:
                type: object