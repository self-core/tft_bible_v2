[package]
name = "etcd-service"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["macros", "ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }
etcd-client = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"
config = "0.14"
uuid = { version = "1.0", features = ["v4"] }
common = { path = "../common" }

[dev-dependencies]
tokio-test = "0.4"
