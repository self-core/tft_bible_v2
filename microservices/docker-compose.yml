version: '3.8'

services:
  # New Go API Gateway
  gateway-api:
    build:
      context: ./gateway-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ETCD_ENDPOINT=etcd:2379
      - SERVICE_NAME=gateway-api
      - SERVICE_HOST=gateway-api
    depends_on:
      - etcd
    networks:
      - tft-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Champion Service
  champion-service:
    build:
      context: .
      dockerfile: ./champion-service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=${MONGODB_URL_WITH_CREDS:-mongodb://admin:password@mongodb:27017/?authSource=admin}
      - DATABASE_NAME=${CHAMPION_DB_NAME:-tft_champions_db}
      - PORT=8000
      - SERVICE_HOST=champion-service
      - GATEWAY_URL=http://gateway-api:8080
    depends_on:
      - mongodb
    networks:
      - tft-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Trait Service
  trait-service:
    build:
      context: .
      dockerfile: ./trait-service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=${MONGODB_URL_WITH_CREDS:-mongodb://admin:password@mongodb:27017/?authSource=admin}
      - DATABASE_NAME=${TRAIT_DB_NAME:-tft_traits_db}
      - PORT=8001
      - SERVICE_HOST=trait-service
      - GATEWAY_URL=http://gateway-api:8080
    depends_on:
      - mongodb
    networks:
      - tft-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Composition Service
  composition-service:
    build:
      context: .
      dockerfile: ./composition-service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=${MONGODB_URL_WITH_CREDS:-mongodb://admin:password@mongodb:27017/?authSource=admin}
      - DATABASE_NAME=${COMPOSITION_DB_NAME:-tft_compositions_db}
      - PORT=8002
      - SERVICE_HOST=composition-service
      - GATEWAY_URL=http://gateway-api:8080
    depends_on:
      - mongodb
    networks:
      - tft-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Trait Tracker Service
  trait-tracker-service:
    build:
      context: .
      dockerfile: ./trait-tracker-service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=${MONGODB_URL_WITH_CREDS:-mongodb://admin:password@mongodb:27017/?authSource=admin}
      - DATABASE_NAME=${TRAIT_TRACKER_DB_NAME:-tft_trait_tracker_db}
      - PORT=8003
      - SERVICE_HOST=trait-tracker-service
      - GATEWAY_URL=http://gateway-api:8080
    depends_on:
      - mongodb
    networks:
      - tft-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # MongoDB
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-password}
    volumes:
      - mongodb_data:/data/db
    networks:
      - tft-network
    restart: unless-stopped

  # Redis for caching and circuit breaker state
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tft-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend-service
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - gateway-api
    networks:
      - tft-network
    restart: unless-stopped

  # etcd Service Discovery
  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.15
    container_name: etcd-server
    command: >
      /usr/local/bin/etcd
      --name etcd-server
      --data-dir /etcd-data
      --advertise-client-urls http://0.0.0.0:2379
      --listen-client-urls http://0.0.0.0:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://etcd-server:2380
      --initial-cluster-token etcd-cluster-1
      --initial-cluster etcd-server=http://etcd-server:2380
      --initial-cluster-state new
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/etcd-data
    networks:
      - tft-network
    restart: unless-stopped

networks:
  tft-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  etcd-data: