version: '3.8'

services:
  # New Go API Gateway
  gateway-api:
    build:
      context: ../microservices/gateway-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ETCD_ENDPOINT=etcd:2379
      - SERVICE_NAME=gateway-api
      - SERVICE_HOST=gateway-api
    depends_on:
      - etcd
    networks:
      - tft-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # etcd Service Discovery
  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.15
    container_name: etcd-server
    command: >
      /usr/local/bin/etcd
      --name etcd-server
      --data-dir /etcd-data
      --advertise-client-urls http://0.0.0.0:2379
      --listen-client-urls http://0.0.0.0:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://etcd-server:2380
      --initial-cluster-token etcd-cluster-1
      --initial-cluster etcd-server=http://etcd-server:2380
      --initial-cluster-state new
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/etcd-data
    networks:
      - tft-network
    restart: unless-stopped

  # Champion Service
  champion-service:
    build:
      context: ../microservices
      dockerfile: ./champion-service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=mongodb://mongodb:27017
      - DATABASE_NAME=tft_champions_db
      - PORT=8000
      - GATEWAY_URL=http://gateway-api:8080
    depends_on:
      - mongodb
    networks:
      - tft-network

  # Trait Service
  trait-service:
    build:
      context: ../microservices/trait-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=mongodb://mongodb:27017
      - DATABASE_NAME=tft_traits_db
      - PORT=8001
      - GATEWAY_URL=http://gateway-api:8080
    depends_on:
      - mongodb
    networks:
      - tft-network

  # Composition Service
  composition-service:
    build:
      context: ../microservices/composition-service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=mongodb://mongodb:27017
      - DATABASE_NAME=tft_compositions_db
      - PORT=8002
      - GATEWAY_URL=http://gateway-api:8080
    depends_on:
      - mongodb
    networks:
      - tft-network

  # Trait Tracker Service
  trait-tracker-service:
    build:
      context: ../microservices/trait-tracker-service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=mongodb://mongodb:27017
      - DATABASE_NAME=tft_trait_tracker_db
      - PORT=8003
      - GATEWAY_URL=http://gateway-api:8080
    depends_on:
      - mongodb
    networks:
      - tft-network

  # MongoDB
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb_data:/data/db
    networks:
      - tft-network
    restart: unless-stopped

  # Redis for caching and circuit breaker state
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tft-network
    restart: unless-stopped

networks:
  tft-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  etcd-data: