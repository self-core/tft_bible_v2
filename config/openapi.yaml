openapi: 3.0.0
info:
  title: TFT Bible API
  description: API for Teamfight Tactics composition tracking and trait analysis
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api.tftbible.com/api/v1
    description: Production server

paths:
  /health:
    get:
      summary: Health check
      description: Verify that the API is running and healthy
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                    example: "2025-11-24T10:00:00Z"
                  version:
                    type: string
                    example: "1.0.0"
                  database:
                    type: string
                    example: "connected"
                  uptime:
                    type: integer
                    example: 3600

  /champions:
    get:
      summary: Get all champions
      description: Retrieve a list of all available champions
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: set
          in: query
          description: Filter by TFT set
          required: false
          schema:
            type: string
        - name: cost
          in: query
          description: Filter by champion cost (1-5 stars)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: traits
          in: query
          description: Filter by comma-separated list of traits
          required: false
          schema:
            type: string
        - name: search
          in: query
          description: Search by champion name
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of champions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChampions'
        '400':
          $ref: '#/components/responses/BadRequest'

  /champions/{id}:
    get:
      summary: Get champion by ID
      description: Retrieve details of a specific champion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Champion ID
      responses:
        '200':
          description: Champion details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Champion'
        '404':
          $ref: '#/components/responses/NotFound'

  /compositions:
    get:
      summary: Get all compositions
      description: Retrieve a paginated list of compositions
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: set
          in: query
          description: Filter by TFT set
          required: false
          schema:
            type: string
        - name: tier
          in: query
          description: Filter by composition tier (S, A, B, C, D)
          required: false
          schema:
            type: string
            enum: [S, A, B, C, D]
        - name: category
          in: query
          description: Filter by composition category
          required: false
          schema:
            type: string
        - name: champion
          in: query
          description: Filter by champion name
          required: false
          schema:
            type: string
        - name: difficulty
          in: query
          description: Filter by difficulty level (1-5)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: patch
          in: query
          description: Filter by patch version
          required: false
          schema:
            type: string
        - name: sort_by
          in: query
          description: Sort results by criteria
          required: false
          schema:
            type: string
            enum: [popularity, tier, newest, winrate]
        - name: tags
          in: query
          description: Filter by comma-separated tags
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of compositions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompositions'
        '400':
          $ref: '#/components/responses/BadRequest'

  /compositions/{id}:
    get:
      summary: Get composition by ID
      description: Retrieve details of a specific composition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Composition ID
      responses:
        '200':
          description: Composition details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Composition'
        '404':
          $ref: '#/components/responses/NotFound'

  /compositions/{id}/vote:
    post:
      summary: Vote on composition
      description: Upvote or downvote a composition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Composition ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vote_type:
                  type: string
                  enum: [upvote, downvote]
                  example: upvote
      responses:
        '200':
          description: Vote recorded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Vote recorded successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /traits:
    get:
      summary: Get all traits
      description: Retrieve a list of all available traits
      parameters:
        - name: set
          in: query
          description: Filter by TFT set
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of traits
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trait'
        '400':
          $ref: '#/components/responses/BadRequest'

  /items:
    get:
      summary: Get all items
      description: Retrieve a list of all available items
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: set
          in: query
          description: Filter by TFT set
          required: false
          schema:
            type: string
        - name: category
          in: query
          description: Filter by item category (AD, AP, Tank, Utility)
          required: false
          schema:
            type: string
        - name: type
          in: query
          description: Filter by item type (Component, Completed, Radiant, Artifact)
          required: false
          schema:
            type: string
        - name: search
          in: query
          description: Search by item name
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedItems'
        '400':
          $ref: '#/components/responses/BadRequest'

  /trait-tracker:
    post:
      summary: Get trait tracker path
      description: Find the optimal path to acquire target traits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_traits:
                  type: array
                  items:
                    type: object
                    properties:
                      trait_name:
                        type: string
                        example: "Assassin"
                      required_count:
                        type: integer
                        example: 3
                current_traits:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "Assassin"
                      count:
                        type: integer
                        example: 1
      responses:
        '200':
          description: Optimal trait acquisition path
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: array
                    items:
                      $ref: '#/components/schemas/TraitPath'
                  efficiency:
                    type: number
                    format: float
                    example: 0.85
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  schemas:
    Champion:
      type: object
      properties:
        id:
          type: string
          example: "TFT15_Ahri"
        name:
          type: string
          example: "Ahri"
        cost:
          type: integer
          minimum: 1
          maximum: 5
          example: 2
        traits:
          type: array
          items:
            type: string
          example: ["Shapeshifter", "Sorcerer"]
        stats:
          $ref: '#/components/schemas/ChampionStats'
        ability:
          $ref: '#/components/schemas/ChampionAbility'
        image:
          type: string
          format: uri
          example: "https://ddragon.leagueoflegends.com/cdn/14.23.1/img/champion/Ahri.png"
      required:
        - id
        - name
        - cost
        - traits

    ChampionStats:
      type: object
      properties:
        health:
          type: number
          format: float
          example: 650.0
        mana:
          type: number
          format: float
          example: 80.0
        starting_mana:
          type: number
          format: float
          example: 30.0
        armor:
          type: number
          format: float
          example: 20.0
        magic_resist:
          type: number
          format: float
          example: 20.0
        attack_damage:
          type: number
          format: float
          example: 40.0
        attack_speed:
          type: number
          format: float
          example: 0.65
        attack_range:
          type: number
          format: float
          example: 3.0
        crit_chance:
          type: number
          format: float
          example: 0.25
        crit_multiplier:
          type: number
          format: float
          example: 1.5

    ChampionAbility:
      type: object
      properties:
        name:
          type: string
          example: "Orb of Deception"
        description:
          type: string
          example: "Ahri fires an orb in a line that deals damage on the way out and heals her on the way back."
        type:
          type: string
          example: "Active"
        targeting:
          type: string
          example: "Enemies"
        damage_type:
          type: string
          example: "Magic"

    Trait:
      type: object
      properties:
        id:
          type: string
          example: "TFTTutorial_Assassin"
        name:
          type: string
          example: "Assassin"
        description:
          type: string
          example: "Assassins leap to the lowest health enemy at the start of combat and gain Critical Strike Chance."
        trait_type:
          type: string
          example: "Class"
          enum: ["Class", "Origin", "Unique"]
        image_url:
          type: string
          format: uri
        breakpoints:
          type: array
          items:
            $ref: '#/components/schemas/TraitBreakpoint'

    TraitBreakpoint:
      type: object
      properties:
        count:
          type: integer
          example: 3
        description:
          type: string
          example: "3 Assassins: 150% Critical Strike Chance"
        bonuses:
          type: object
          additionalProperties:
            type: number
          example:
            crit_chance: 1.5

    Item:
      type: object
      properties:
        id:
          type: string
          example: "3072"
        name:
          type: string
          example: "Bloodthirster"
        description:
          type: string
          example: "Grants Critical Strike Chance and Life Steal. Critical Strikes heal for 33% of damage dealt."
        item_type:
          type: string
          example: "Completed"
          enum: ["Component", "Completed", "Radiant", "Artifact"]
        category:
          type: string
          example: "AD"
          enum: ["AD", "AP", "Tank", "Utility"]
        stats:
          $ref: '#/components/schemas/ItemStats'
        image_url:
          type: string
          format: uri

    ItemStats:
      type: object
      properties:
        attack_damage:
          type: number
          format: float
          example: 20.0
        ability_power:
          type: number
          format: float
          example: 10.0
        attack_speed:
          type: number
          format: float
          example: 0.15
        health:
          type: number
          format: float
          example: 150.0
        armor:
          type: number
          format: float
          example: 20.0
        magic_resist:
          type: number
          format: float
          example: 20.0
        mana:
          type: number
          format: float
          example: 15.0

    Composition:
      type: object
      properties:
        id:
          type: string
          example: "comp_12345"
        name:
          type: string
          example: "Ninja Assassin Carry"
        description:
          type: string
          example: "A composition focused on high damage ninja assassins"
        category:
          type: string
          example: "Assassin"
        tags:
          type: array
          items:
            type: string
          example: ["beginner", "aggressive"]
        champions:
          type: array
          items:
            $ref: '#/components/schemas/CompositionChampion'
        augments:
          $ref: '#/components/schemas/CompositionAugments'
        meta:
          $ref: '#/components/schemas/CompositionMeta'
        votes:
          $ref: '#/components/schemas/Votes'
        views:
          type: integer
          example: 1500
        created_at:
          type: string
          format: date-time
          example: "2025-11-20T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-21T15:30:00Z"

    CompositionChampion:
      type: object
      properties:
        champion_id:
          type: string
          example: "TFT15_Ahri"
        star_level:
          type: integer
          minimum: 1
          maximum: 3
          example: 2
        items:
          type: array
          items:
            type: string
          example: ["3072", "3089", "3031"]  # Bloodthirster, Rabadon's, Infinity Edge
        position:
          $ref: '#/components/schemas/Position'
        is_core:
          type: boolean
          example: true
        priority:
          type: integer
          example: 1

    Position:
      type: object
      properties:
        x:
          type: integer
          minimum: 0
          maximum: 6
          example: 4
        y:
          type: integer
          minimum: 0
          maximum: 3
          example: 1

    CompositionAugments:
      type: object
      properties:
        preferred:
          type: array
          items:
            type: string
          example: ["big_shot_heart", "giant_slayer"]
        acceptable:
          type: array
          items:
            type: string
          example: ["tactical_resupply", "thrill_of_the_hunt"]
        avoid:
          type: array
          items:
            type: string
          example: ["ascension", "steady_presence"]

    CompositionMeta:
      type: object
      properties:
        tier:
          type: string
          enum: [S, A, B, C, D]
          example: "S"
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
          example: 3
        cost:
          type: string
          example: "Flexible"
        patch:
          type: string
          example: "14.23"
        playstyle:
          type: string
          example: "Aggressive"
        winrate:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          example: 0.65
        avg_placement:
          type: number
          format: float
          minimum: 1.0
          maximum: 8.0
          example: 2.7
        playrate:
          type: number
          format: float
          example: 0.15
        contest_rate:
          type: number
          format: float
          example: 0.10

    Votes:
      type: object
      properties:
        upvotes:
          type: integer
          example: 120
        downvotes:
          type: integer
          example: 15

    TraitPath:
      type: object
      properties:
        champion:
          $ref: '#/components/schemas/Champion'
        traits_gained:
          type: array
          items:
            type: string
          example: ["Assassin", "Shapeshifter"]
        cost:
          type: integer
          example: 2
        efficiency:
          type: number
          format: float
          example: 1.5

    PaginatedChampions:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Champion'
        total:
          type: integer
          example: 150
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total_pages:
          type: integer
          example: 8

    PaginatedCompositions:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Composition'
        total:
          type: integer
          example: 50
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total_pages:
          type: integer
          example: 3

    PaginatedItems:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        total:
          type: integer
          example: 80
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total_pages:
          type: integer
          example: 4

  responses:
    BadRequest:
      description: Bad request - invalid parameters or missing required fields
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Invalid request parameters"
              errors:
                type: array
                items:
                  type: string
                example: ["limit must be between 1 and 100", "invalid trait specified"]

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Resource not found"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT