[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
axum = "0.8.6"
tokio = { version = "1.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "fs"] }
env_logger = "0.11"
once_cell = "1.19"
windows-targets = "0.53.5"

# Database
mongodb = "3.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bson = { version = "3.0.0", features = ["chrono-0_4"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Environment variables
dotenv = "0.15"

# Logging
log = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "2.0.17"

# HTTP client
reqwest = { version = "0.12.23", features = ["json"] }

# Authentication
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }

# Message queue
rdkafka = { version = "0.37", features = ["cmake-build", "tokio", "sasl", "ssl"] }

# Async processing
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

[dev-dependencies]
# Testing
tokio-test = "0.4"
tower = { version = "0.5.2", features = ["util"] }
axum-test = "17.0"
