name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test with Docker
        working-directory: backend
        run: |
          docker build -t tft-backend:test .
          docker run --rm tft-backend:test cargo test --verbose
          docker run --rm tft-backend:test cargo clippy -- -D warnings

      - name: Generate test coverage
        working-directory: backend
        run: |
          docker run --rm -v $(pwd):/app tft-backend:test cargo tarpaulin --ignore-tests --out Xml
          docker run --rm -v $(pwd):/app tft-backend:test cargo tarpaulin --ignore-tests --out Html

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/cobertura.xml
          flags: rust
          name: codecov-umbrella
          fail_ci_if_error: false
