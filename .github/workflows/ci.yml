name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Build backend
        working-directory: backend
        run: cargo build --locked --verbose
      - name: Clippy
        working-directory: backend
        run: cargo clippy -- -D warnings
      - name: Tests
        working-directory: backend
        run: cargo test --all --verbose
