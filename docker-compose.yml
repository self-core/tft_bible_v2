services:
  tft-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=tft_bible_dev
      - PORT=8080
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - tft-network

  tft-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3004:80"
    depends_on:
      - tft-backend
    environment:
      - VITE_API_URL=http://tft-backend:8080
      - VITE_GRAPHQL_URL=/graphql
    networks:
      - tft-network

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    env_file:
      - .env
    volumes:
      - mongodb_data:/data/db
      - ./backend/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    networks:
      - tft-network

volumes:
  mongodb_data:

networks:
  tft-network:
    driver: bridge