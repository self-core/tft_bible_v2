services:
  tft-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - mongodb
    networks:
      - tft-network

  tft-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - tft-backend
    volumes:
      # Mount source code for hot reloading during development
      - ./frontend:/app
      - /app/node_modules  # Don't mount node_modules to avoid conflicts
    env_file:
      - .env
    networks:
      - tft-network
    # For development with hot reloading, use this instead:
    # command: npm run dev -- --host 0.0.0.0
    # ports:
    #   - "3000:3000"

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    env_file:
      - .env
    volumes:
      - mongodb_data:/data/db
      - ./backend/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    networks:
      - tft-network

  # Optional: Redis for caching (uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - tft-network

volumes:
  mongodb_data:
  # redis_data:

networks:
  tft-network:
    driver: bridge