services:
  tft-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=tft_bible_dev
      - KAFKA_URL=kafka:9092
      - PORT=8080
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - mongodb
      - kafka
    networks:
      - tft-network

  tft-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3004:80"
    depends_on:
      - tft-backend
    volumes:
      # Mount source code for hot reloading during development
      - ./frontend:/app
      - /app/node_modules  # Don't mount node_modules to avoid conflicts
    environment:
      - VITE_API_URL=http://localhost:8081
    networks:
      - tft-network
    # For development with hot reloading, use this instead:
    # command: npm run dev -- --host 0.0.0.0
    # ports:
    #   - "3000:3000"

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    env_file:
      - .env
    volumes:
      - mongodb_data:/data/db
      - ./backend/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    networks:
      - tft-network

  # Kafka for message queue
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - tft-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - tft-network

volumes:
  mongodb_data:

networks:
  tft-network:
    driver: bridge