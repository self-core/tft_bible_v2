version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk11
    privileged: true
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - C:\Users\puppets\Documents\tft_bible_v2:/workspace:ro
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    networks:
      - tft-cicd-network

  docker-registry:
    image: registry:2
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - tft-cicd-network

  # For local testing of deployments
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=tft_bible_dev
    volumes:
      - mongodb_data:/data/db
    networks:
      - tft-cicd-network

volumes:
  jenkins_home:
  registry_data:
  mongodb_data:

networks:
  tft-cicd-network:
    driver: bridge